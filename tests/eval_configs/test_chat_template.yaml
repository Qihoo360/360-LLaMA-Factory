### Chat Template Configuration Test
### Tests: Chat template loading and message encoding

### Model Configuration with Chat Template
model_name_or_path: microsoft/DialoGPT-medium
template: default

### Task Configuration  
task: needle_haystack
task_dir: evaluation
save_dir: tests/results/chat_template
batch_size: 1
seed: 700

### Chat Template Test Parameters
needle_context_lengths: [300, 600]
needle_depth_percents: [0, 50, 100]
needle_text: "The chat template secret is CHAT2024."
needle_question: "What is the chat template secret?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Message Encoding Test Generation
needle_generation_temperature: 0.0
needle_generation_top_p: 1.0
needle_generation_top_k: 1
needle_generation_max_tokens: 20

### Configuration to test chat template detection
infer_dtype: auto
use_cache: true