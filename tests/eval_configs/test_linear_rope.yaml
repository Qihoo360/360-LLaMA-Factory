### Linear RoPE Scaling Test Configuration
### Tests: Linear RoPE scaling with model generation config

### Model Configuration
model_name_or_path: microsoft/DialoGPT-small
template: default
rope_scaling_type: linear
rope_scaling_factor: 2.0

### Single GPU Configuration
sequence_parallel_size: 1
flash_attn: auto

### Inference Configuration
infer_dtype: auto
use_cache: true

### Task Configuration
task: needle_haystack
task_dir: evaluation
save_dir: tests/results/linear_rope
batch_size: 1
seed: 100

### Test Parameters
needle_context_lengths: [300, 600, 1000]
needle_depth_percents: [0, 25, 75, 100]
needle_text: "The linear RoPE key is LINEAR456."
needle_question: "What is the linear RoPE key?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Generation Configuration
needle_generation_temperature: 0.1
needle_generation_top_p: 0.9
needle_generation_top_k: 50
needle_generation_max_tokens: 30