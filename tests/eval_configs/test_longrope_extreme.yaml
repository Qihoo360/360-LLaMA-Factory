### LongRoPE Extreme Scaling Test Configuration
### Tests: LongRoPE with custom interpolation factors

### Model Configuration  
model_name_or_path: microsoft/DialoGPT-small
template: default
rope_scaling_type: longrope
rope_scaling_factor: 8.0
longrope_short_factor: [1.0, 1.0, 1.2, 1.4]
longrope_long_factor: [1.0, 2.0, 4.0, 8.0]

### Multi-GPU Configuration
sequence_parallel_size: 2
sequence_parallel_mode: ulysses
flash_attn: auto

### Inference Configuration
infer_dtype: auto
use_cache: true

### Task Configuration
task: needle_haystack
task_dir: evaluation
save_dir: tests/results/longrope_extreme
batch_size: 1  
seed: 300

### Extreme Context Test Parameters
needle_context_lengths: [800, 1600, 3200]
needle_depth_percents: [0, 33, 66, 100]
needle_text: "The LongRoPE master key is LONGROPE999."
needle_question: "What is the LongRoPE master key?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Balanced Generation Settings
needle_generation_temperature: 0.2
needle_generation_top_p: 0.9
needle_generation_top_k: 35
needle_generation_max_tokens: 40