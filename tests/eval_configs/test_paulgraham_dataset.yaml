### Paul Graham Dataset Test Configuration
### Tests: PaulGraham essays dataset with directory loading

### Model Configuration
model_name_or_path: microsoft/DialoGPT-small  
template: default
rope_scaling_type: dynamic
rope_scaling_factor: 2.5

### Single GPU Configuration
sequence_parallel_size: 1
flash_attn: auto

### Inference Configuration
infer_dtype: auto
use_cache: true

### Task Configuration
task: needle_haystack
task_dir: evaluation
save_dir: tests/results/paulgraham_dataset
batch_size: 1
seed: 400

### PaulGraham Dataset Test Parameters
needle_context_lengths: [600, 1200]
needle_depth_percents: [0, 50, 100]
