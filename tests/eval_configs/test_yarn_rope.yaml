### YARN RoPE Scaling Test Configuration  
### Tests: YARN RoPE with alpha/beta parameters and creative generation

### Model Configuration
model_name_or_path: microsoft/DialoGPT-small
template: default
rope_scaling_type: yarn
rope_scaling_factor: 4.0
yarn_alpha: 1.5
yarn_beta: 64.0

### Multi-GPU Simulation (will use available GPUs)
sequence_parallel_size: 2
sequence_parallel_mode: zigzag-ring
flash_attn: auto

### Inference Configuration
infer_dtype: auto
use_cache: true
low_cpu_mem_usage: true

### Task Configuration
task: needle_haystack
task_dir: evaluation  
save_dir: tests/results/yarn_rope
batch_size: 1
seed: 200

### YARN Test Parameters
needle_context_lengths: [500, 1000, 2000]
needle_depth_percents: [0, 20, 40, 60, 80, 100]
needle_text: "The YARN secret code is YARN789."
needle_question: "What is the YARN secret code?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Creative Generation Settings
needle_generation_temperature: 0.3
needle_generation_top_p: 0.95
needle_generation_top_k: 40
needle_generation_max_tokens: 50