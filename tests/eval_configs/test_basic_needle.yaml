### Basic Needle Haystack Test Configuration
### Tests: Basic functionality without RoPE scaling

### Model Configuration
model_name_or_path: microsoft/DialoGPT-small
template: default

### Basic Settings
task: needle_haystack
task_dir: evaluation
save_dir: tests/results/basic_needle
batch_size: 1
seed: 42

### Minimal Needle Parameters
needle_context_lengths: [200, 500]
needle_depth_percents: [0, 50, 100]
needle_text: "The basic test key is ABC123."
needle_question: "What is the basic test key?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Basic Generation Settings
needle_generation_temperature: 0.0
needle_generation_top_p: 1.0
needle_generation_top_k: 1
needle_generation_max_tokens: 20