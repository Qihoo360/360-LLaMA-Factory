### model
model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0

### method
finetuning_type: full

### dataset
task: needle_haystack_proper
task_dir: evaluation
template: alpaca
lang: en

### output
save_dir: saves/tinyllama/needle_haystack_custom_dir

### eval
batch_size: 1

### needle haystack configuration - Custom Directory Demo
needle_context_lengths: [300, 600]  # Contexts for custom text files
needle_depth_percents: [0, 50, 100]  # 3 positions  
needle_text: "The secret key is CUSTOM123."  # Custom needle
needle_question: "What is the secret key?"  # Question about the needle
needle_haystack_data_source: "directory"  # Use custom directory
needle_haystack_data_dir: "evaluation/needle_haystack/data/PaulGrahamEssays"  # Path to text files