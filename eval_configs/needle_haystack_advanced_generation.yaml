### Model Configuration with Advanced Generation Settings
model_name_or_path: microsoft/Phi-3.5-mini-instruct
template: phi
rope_scaling_type: yarn
rope_scaling_factor: 4.0
yarn_alpha: 1.0
yarn_beta: 32.0

### Advanced Multi-GPU Configuration
sequence_parallel_size: 4
sequence_parallel_mode: zigzag-ring
flash_attn: fa2

### Advanced Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_advanced

### Needle Haystack Parameters
needle_context_lengths: [2000, 8000, 16000, 32000, 64000]
needle_depth_percents: [0, 10, 25, 50, 75, 90, 100]
needle_text: "The advanced secret code is ALPHA-BRAVO-CHARLIE-123."
needle_question: "What is the advanced secret code?"
needle_haystack_data_source: paulgraham
needle_save_inputs_outputs: true

### Advanced Generation Configuration
# This showcases how generation config from model will be loaded and merged
needle_generation_temperature: 0.3        # Enable creative sampling
needle_generation_top_p: 0.95            # Nucleus sampling
needle_generation_top_k: 40              # Top-k sampling  
needle_generation_max_tokens: 150        # Longer responses

### Performance Settings
batch_size: 1
seed: 2024

### Optional: Additional generation parameters (will be merged with model defaults)
# repetition_penalty: 1.1                # Reduce repetition
# length_penalty: 1.0                    # Length preference
# no_repeat_ngram_size: 3               # Avoid n-gram repetition