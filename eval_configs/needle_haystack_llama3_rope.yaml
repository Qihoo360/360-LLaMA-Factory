### Model Configuration
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
rope_scaling_type: llama3
rope_scaling_factor: 2.0

### Multi-GPU Configuration
sequence_parallel_size: 2
sequence_parallel_mode: llama3
flash_attn: fa2

### Inference Configuration
infer_dtype: bfloat16
use_cache: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_llama3

### Needle Haystack Parameters
needle_context_lengths: [4000, 8000, 16000, 32000]
needle_depth_percents: [0, 20, 40, 60, 80, 100]
needle_text: "The password is SuperSecret2024!"
needle_question: "What is the password?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Generation Configuration
needle_generation_temperature: 0.0
needle_generation_top_p: 1.0
needle_generation_top_k: 1
needle_generation_max_tokens: 20

### Batch and Performance
batch_size: 1
seed: 2024