needle_haystack_data_source: directory
needle_haystack_data_dir: evaluation/needle_haystack/data/PaulGrahamEssays
needle_save_inputs_outputs: true

### Generation Configuration
needle_generation_temperature: 0.1
needle_generation_top_p: 0.95
needle_generation_top_k: 40
needle_generation_max_tokens: 100

### Batch and Performance
batch_size: 1
seed: 12345