### Model Configuration
model_name_or_path: microsoft/Phi-3.5-mini-instruct
rope_scaling_type: longrope
rope_scaling_factor: 8.0
longrope_short_factor: [1.0, 1.0, 1.0, 1.0, 1.2, 1.2, 1.4, 1.4]
longrope_long_factor: [1.0, 1.0, 1.0, 1.0, 2.0, 2.0, 4.0, 4.0]

### Multi-GPU Configuration
sequence_parallel_size: 4
sequence_parallel_mode: ulysses
flash_attn: fa2

### Inference Configuration
infer_dtype: bfloat16
use_cache: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_longrope

### Needle Haystack Parameters
needle_context_lengths: [2000, 8000, 16000, 32000, 64000, 128000]
needle_depth_percents: [0, 25, 50, 75, 100]
needle_text: "The magic number is 987654321."
