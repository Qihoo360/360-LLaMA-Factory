### Model Configuration - LongBench v2 Test Evaluation
# Using a tiny model for quick testing
model_name_or_path: gpt2
# template: default  # Optional - auto-detects from model's tokenizer_config.json if not specified

### Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: longbench_v2
task_dir: evaluation
save_dir: results/longbench_v2_test

### LongBench v2 Parameters
longbench_max_examples: 5  # Small number for testing
longbench_difficulty: easy
longbench_max_context_length: 4096  # Smaller context for testing
longbench_save_context: false

### Generation Configuration  
longbench_temperature: 0.1
longbench_top_p: 1.0
longbench_top_k: 1
longbench_max_new_tokens: 128

### Performance Settings
batch_size: 1
seed: 42