### Model Configuration - LongBench v2 Full Evaluation
model_name_or_path: /exp/austin/F1_V4
template: llama3
# Use model's built-in RoPE scaling (8x factor, llama3 type)

### Multi-GPU Configuration (Optional)
# sequence_parallel_size: 8
# sequence_parallel_mode: zigzag-ring
flash_attn: auto

### Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: longbench_v2
task_dir: evaluation
save_dir: results/longbench_v2_full

### LongBench v2 Parameters - Full Evaluation
longbench_max_examples: 0  # 0 = evaluate all 503 examples
longbench_max_context_length: 128000  # Allow up to 128K context
longbench_save_context: true
longbench_max_length: 131072

### Generation Configuration  
longbench_temperature: 0.1
longbench_top_p: 1.0
longbench_top_k: 1
longbench_max_new_tokens: 256

### Performance Settings
batch_size: 1
seed: 42