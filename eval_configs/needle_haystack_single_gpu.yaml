### Model Configuration - Single GPU Evaluation
model_name_or_path: /exp/austin/F1_V4
template: llama3
# Use model's built-in RoPE scaling (8x factor, llama3 type)

### Single GPU Configuration - NO DISTRIBUTED
# DO NOT SET sequence_parallel_size for single GPU
flash_attn: auto

### Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_single_gpu

### Needle Haystack Parameters
needle_context_lengths: [1000, 2000, 4000, 8000, 16000, 32000, 64000]
needle_depth_percents: [0, 10, 25, 50, 75, 90, 100]
needle_text: "The secret key is 42 alpha bravo."
needle_question: "What is the secret key?"
needle_haystack_data_source: paulgraham
needle_save_inputs_outputs: true

### Generation Configuration  
needle_generation_temperature: 0.0
needle_generation_top_p: 0.9
needle_generation_top_k: 50
needle_generation_max_tokens: 50

### Batch and Performance
batch_size: 1
seed: 42