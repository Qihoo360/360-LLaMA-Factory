### Model Configuration - 4 GPU Distributed Evaluation
model_name_or_path: /exp/austin/F1_V4
template: llama3
# Use model's built-in RoPE scaling (8x factor, llama3 type)

### 4 GPU Distributed Configuration
sequence_parallel_size: 4
sequence_parallel_mode: zigzag-ring
flash_attn: fa2

### Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_4gpu_distributed

### Needle Haystack Parameters
needle_context_lengths: [2000, 4000, 8000, 16000, 32000, 64000]
needle_depth_percents: [0, 25, 50, 75, 100]
needle_text: "The 4-GPU distributed secret is SEQUENCE-PARALLEL-QUAD."
needle_question: "What is the 4-GPU distributed secret?"
needle_haystack_data_source: paulgraham
needle_save_inputs_outputs: true

### Generation Configuration  
needle_generation_temperature: 0.0
needle_generation_top_p: 0.9
needle_generation_top_k: 50
needle_generation_max_tokens: 50

### Batch and Performance
batch_size: 1
seed: 4444