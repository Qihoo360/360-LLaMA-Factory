### Model Configuration - LongBench v2 Basic Evaluation
model_name_or_path: /exp/austin/F1_V4
# template: llama3  # Optional - auto-detects from model's tokenizer_config.json if not specified
# Use model's built-in RoPE scaling (8x factor, llama3 type)

### Inference Configuration
infer_dtype: bfloat16
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: longbench_v2
task_dir: evaluation
save_dir: results/longbench_v2_basic

### LongBench v2 Parameters
longbench_max_examples: 50
longbench_difficulty: easy
longbench_max_context_length: 32000
longbench_save_context: false

### Generation Configuration  
longbench_temperature: 0.1
longbench_top_p: 1.0
longbench_top_k: 1
longbench_max_new_tokens: 128

### Performance Settings
batch_size: 1
seed: 42