### Model Configuration - Using a small model for testing
model_name_or_path: microsoft/DialoGPT-small
template: default
rope_scaling_type: linear
rope_scaling_factor: 2.0

### Single GPU Configuration for testing
sequence_parallel_size: 1
flash_attn: auto

### Inference Configuration
infer_dtype: auto
use_cache: true
low_cpu_mem_usage: true

### Evaluation Task
task: needle_haystack
task_dir: evaluation
save_dir: results/needle_haystack_test

### Small test parameters for quick validation
needle_context_lengths: [500, 1000]
needle_depth_percents: [0, 50, 100]
needle_text: "The test key is 123."
needle_question: "What is the test key?"
needle_haystack_data_source: custom
needle_save_inputs_outputs: true

### Generation Configuration  
needle_generation_temperature: 0.0
needle_generation_top_p: 0.9
needle_generation_top_k: 50
needle_generation_max_tokens: 20

### Batch and Performance
batch_size: 1
seed: 42